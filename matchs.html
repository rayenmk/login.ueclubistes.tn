<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UE Clubiste — Matchs</title>
<link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="subscriber">
<div class="app">
<aside class="sidebar">
  <div class="side-brand"><img src="assets/logo.png"><div><b>UE Clubiste</b><small>Espace Abonné</small></div></div>
  <nav>
    <a href="subscriber.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.3 18.5c.9-2.5 3-3.8 5.7-3.8s4.8 1.3 5.7 3.8"/></svg> <span>Mon profil</span></a>
    <a class="active" href="matchs.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.2l3.4 2.5-1.3 4h-4.2l-1.3-4z"/><path d="M12 8.2V4.6M15.4 10.7l3.3-1.4M13.1 14.7l1.9 3.1M8.9 14.7L7 17.8M8.6 10.7L5.3 9.3"/></svg> <span>Matchs</span></a>
    <a href="subscriber.html#security"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 118 0v3"/></svg> <span>Sécurité</span></a>
  </nav>
  <button id="logoutBtn" class="side-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4H18a2 2 0 012 2v12a2 2 0 01-2 2h-4.5"/><path d="M3 12h11.5"/><path d="M11 8l4 4-4 4"/></svg> Déconnexion</button>
</aside>
<div class="main">
<header class="topbar"><button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><span class="top-kicker">ESPACE ABONNÉ</span><h1>Matchs</h1></div><div class="top-user"><div class="avatar" id="avatar">U</div><span id="userName">Utilisateur</span></div></header>
<main class="content">
  <div id="pageAlert"></div>
  <section class="hero-card match-hero"><div><span class="mini-label">CALENDRIER</span><h2>Les matchs de l'Union</h2><p>Choisissez votre place pour chaque rencontre. Aucun paiement n'est demandé.</p></div><span id="genderBadge" class="badge">—</span></section>
  <section class="panel"><div class="panel-head"><div><span class="mini-label">PROGRAMME</span><h2>Calendrier des matchs</h2></div><select id="sportFilter" class="match-filter"><option value="">Tous les sports</option><option value="FOOTBALL">Football</option><option value="HANDBALL">Handball</option><option value="BASKETBALL">Basketball</option></select></div>
  <div id="matchesGrid" class="matches-grid"></div></section>
</main></div></div>

<div id="matchModal" class="modal hidden"><div class="modal-box match-modal"><div class="modal-head"><div><span class="mini-label">CHOIX DE PLACE</span><h2 id="modalMatchTitle">Match</h2><p id="modalMatchMeta" class="modal-subtitle"></p></div><button class="close" id="closeMatchModal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="zones" class="zones-grid"></div>
<div id="currentChoice" class="current-choice hidden"></div>
<div class="form-actions match-actions"><button type="button" id="notParticipateBtn" class="btn secondary">Je ne participe pas</button><button type="button" id="confirmZoneBtn" class="btn primary">Confirmer mon choix</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/matchs.js"></script>
</body></html>
